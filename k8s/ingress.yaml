apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: merchprint-ingress
  namespace: merchprint
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # Opcional: descomentar para habilitar CORS
    # nginx.ingress.kubernetes.io/enable-cors: "true"
    # nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    # nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    # Opcional: descomentar para rate limiting
    # nginx.ingress.kubernetes.io/limit-rps: "10"
    # Opcional: descomentar para forzar HTTPS
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Opcional: descomentar para cert-manager automático
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  # Opcional: descomentar para habilitar HTTPS/TLS
  # tls:
  #   - hosts:
  #       - api.merchprint.local
  #     secretName: merchprint-tls
  rules:
    - host: api.merchprint.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 3000
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 3000
