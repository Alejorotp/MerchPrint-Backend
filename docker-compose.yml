version: '3.8'
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "3000:3000"
    environment:
      RMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      - rabbitmq

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "3001:3000"
    environment:
      DB_URI: mongodb://auth_user:auth_pass@auth-service-db:27017/auth_db?authSource=admin
      JWT_SECRET: 42a50a5f631234be3f9ff00d5578b764
      RMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      - auth-service-db
      - rabbitmq

  orders-service:
    build:
      context: .
      dockerfile: apps/orders-service/Dockerfile
    container_name: orders-service
    ports:
      - "3002:3000"
    environment:
      DB_URI: mongodb://orders_user:orders_pass@orders-service-db:27017/orders_db?authSource=admin
      RMQ_URL: amqp://guest:guest@rabbitmq:5672
      GENERATE_IMAGE_API_KEY: AIzaSyANgJ6pjprwXkb99K9rEty5Ol9VT0Vcl3I
    depends_on:
      - orders-service-db
      - rabbitmq

  companies-service:
    build:
      context: .
      dockerfile: apps/companies-service/Dockerfile
    container_name: companies-service
    ports:
      - "3003:3000"
    environment:
      DB_URI: mongodb://companies_user:companies_pass@companies-service-db:27017/companies_db?authSource=admin
      RMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      - companies-service-db
      - rabbitmq

  events-service:
    build:
      context: .
      dockerfile: apps/events-service/Dockerfile
    container_name: events-service
    ports:
      - "3004:3000"
    environment:
      DB_URI: mongodb://events_user:events_pass@events-service-db:27017/events_db?authSource=admin
      RMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      - events-service-db
      - rabbitmq

  auth-service-db:
    image: mongo:latest
    container_name: auth-service-db
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: auth_user
      MONGO_INITDB_ROOT_PASSWORD: auth_pass
    volumes:
      - auth_service_db_data:/data/db

  orders-service-db:
    image: mongo:latest
    container_name: orders-service-db
    restart: unless-stopped
    ports:
      - "27019:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: orders_user
      MONGO_INITDB_ROOT_PASSWORD: orders_pass
      MONGO_INITDB_DATABASE: orders_db
    volumes:
      - orders_service_db_data:/data/db

  companies-service-db:
    image: mongo:latest
    container_name: companies-service-db
    restart: unless-stopped
    ports:
      - "27020:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: companies_user
      MONGO_INITDB_ROOT_PASSWORD: companies_pass
    volumes:
      - companies_service_db_data:/data/db

  events-service-db:
    image: mongo:latest
    container_name: events-service-db
    restart: unless-stopped
    ports:
      - "27021:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: events_user
      MONGO_INITDB_ROOT_PASSWORD: events_pass
    volumes:
      - events_service_db_data:/data/db

  api-gateway-e2e-tests:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
      target: development
    command: npm run test:e2e
    environment:
      - API_GATEWAY_URL=http://api-gateway:3000
    depends_on:
      - api-gateway
      - auth-service
      - companies-service
      - events-service
      - orders-service

volumes:
  auth_service_db_data:
  orders_service_db_data:
  companies_service_db_data:
  events_service_db_data:
